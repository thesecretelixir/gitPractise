<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Targeted Solutions</title>
    <link rel="stylesheet" href="lickMypussy.css">
</head>
<body>

  <!-- SECTION 2 — Targeted Solutions: Subtitle | Title | Dots | Image -->
  <section class="about-section about-targeted">
    <div class="about-container about-container--narrow">

      <p class="about-targeted__subtitle">Targeted Solutions</p>

      <h2 class="about-targeted__title">
        <span class="font-accent">Precision Built</span>
        <br><em class="font-italic">for you</em>
      </h2>

      <div class="about-targeted__dots" aria-hidden="true">
        <span class="dot dot--pink"></span>
        <span class="dot dot--navy"></span>
        <span class="dot dot--blue"></span>
        <span class="dot dot--green"></span>
      </div>

      <div class="about-targeted__image-wrap">
        <img
          src="suraj.jpg"
          alt="Targeted solutions image"
          loading="lazy"
          width="1200"
          class="about-targeted__image"
        >
      </div>

    </div>
  </section>

</html>
